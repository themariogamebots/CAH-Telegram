# Los starters de long-polling y de webhook registran los dos un bean 'telegramBotsApplication' y
# chocan entre sí (Boot 4 no permite override de beans). Aquí no hace falta ninguno: esto se prueba
# sin bots. Para la aplicación real hay que decidir el modo, ver F4 en el plan.
spring.autoconfigure.exclude=\
  org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration,\
  org.telegram.telegrambots.webhook.starter.TelegramBotStarterConfiguration

spring.datasource.url=jdbc:h2:mem:cahtelegram;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lo que se está probando: que el baseline de Flyway y el modelo de entidades cuadran.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.default-language=es

cah.game.default-votation-mode=CLASSIC
cah.game.default-punctuation-mode=POINTS
cah.game.default-number-of-points-to-win=5
cah.game.default-number-of-rounds-to-end=10
cah.game.default-min-number-of-players=3
cah.game.min-human-players=2
cah.game.default-max-number-of-players=10
cah.game.number-of-cards-in-hand=5

cah.dictionaries.min-number-of-white-cards=50
cah.dictionaries.max-number-of-white-cards=1000
cah.dictionaries.min-number-of-black-cards=10
cah.dictionaries.max-number-of-black-cards=500
cah.dictionaries.min-white-card-length=3
cah.dictionaries.max-white-card-length=256
cah.dictionaries.min-black-card-length=3
cah.dictionaries.max-black-card-length=256
cah.dictionaries.max-number-of-collaborators=10
cah.dictionaries.max-number-of-unfinished-dictionaries=5
