spring.profiles.active=@spring.profiles.active@

server.port=${SERVER_PORT}

spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driverClassName=${JDBC_DRIVER}

# El esquema lo gobierna Flyway; Hibernate solo comprueba que el modelo cuadra con él.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration/${FLYWAY_ENGINE}

# Idioma por defecto cuando el de Telegram no está entre los soportados
app.default-language=es

# Reglas de partida
cah.game.default-votation-mode=CLASSIC
cah.game.default-punctuation-mode=POINTS
cah.game.default-number-of-points-to-win=5
cah.game.default-number-of-rounds-to-end=10
cah.game.default-min-number-of-players=3
cah.game.min-human-players=2
cah.game.default-max-number-of-players=10
cah.game.number-of-cards-in-hand=5
# "Clasico" del backup legacy (id antiguo 1); UUID determinista fijado por el script de migración
cah.game.default-dictionary-id=00000000-0000-4000-a000-000000000001

# Reglas de diccionarios
cah.dictionaries.min-number-of-white-cards=50
cah.dictionaries.max-number-of-white-cards=1000
cah.dictionaries.min-number-of-black-cards=10
cah.dictionaries.max-number-of-black-cards=500
cah.dictionaries.min-white-card-length=3
cah.dictionaries.max-white-card-length=256
cah.dictionaries.min-black-card-length=3
cah.dictionaries.max-black-card-length=256
cah.dictionaries.max-number-of-collaborators=10
cah.dictionaries.max-number-of-unfinished-dictionaries=5

# Ids de Telegram con permisos de administración, separados por comas
telegram.bots.admin-ids=${TELEGRAM_ADMIN_IDS:}

# Modo de los bots: longpolling | webhook. Es común a los dos bots del despliegue.
telegram.bots.type=${BOT_TYPE:longpolling}

# Los starters de telegrambots registran los dos un bean 'telegramBotsApplication' y chocan entre sí
# (Boot 4 no permite override de beans). Los sustituye TelegramBotsRegistrarConfig, que además añade
# el endpoint HTTP que el starter de webhook no trae.
spring.autoconfigure.exclude=\
  org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration,\
  org.telegram.telegrambots.webhook.starter.TelegramBotStarterConfiguration

# Datos de presentación de los bots (antes en la tabla t_configuration)
cah.telegram.dictionaries-per-page=10
cah.telegram.game.display-name=Cartas contra la humanidad
cah.telegram.game.alias=@cclhbot
cah.telegram.game.version=2.0.0
cah.telegram.game.owner-alias=@themarioga
cah.telegram.game.help-url=https://telegra.ph/Manual-del-bot-Cartas-Contra-la-Humanidad-cclhbot-01-31
cah.telegram.dictionaries.display-name=Diccionarios para CCLHBot
cah.telegram.dictionaries.alias=@cclhdictionariesbot
cah.telegram.dictionaries.version=2.0.0
cah.telegram.dictionaries.owner-alias=@themarioga
cah.telegram.dictionaries.help-url=https://telegra.ph/Manual-del-bot-Cartas-Contra-la-Humanidad-cclhbot-01-31

cclh.bot.enabled=${CCLH_BOT_ENABLED}
cclh.bot.token=${CCLH_BOT_TOKEN}
cclh.bot.name=${CCLH_BOT_NAME}
# Debe apuntar a <host>/callback/${CCLH_BOT_NAME}
cclh.bot.webhook.url=${CCLH_BOT_WEBHOOK_URL:}
cclh.bot.webhook.cert.path=${CCLH_BOT_WEBHOOK_CERT_PATH:}

dictionaries.bot.enabled=${DICTIONARIES_BOT_ENABLED}
dictionaries.bot.token=${DICTIONARIES_BOT_TOKEN}
dictionaries.bot.name=${DICTIONARIES_BOT_NAME}
# Debe apuntar a <host>/callback/${DICTIONARIES_BOT_NAME}
dictionaries.bot.webhook.url=${DICTIONARIES_BOT_WEBHOOK_URL:}
dictionaries.bot.webhook.cert.path=${DICTIONARIES_BOT_WEBHOOK_CERT_PATH:}
